# =====================================================================
# Render Blueprint — Agentic Company Simulator (backend only)
# =====================================================================
# This file declares the FastAPI backend as a Render web service. The
# frontend is deployed separately to Vercel (see vercel.json) and the
# PostgreSQL database is provisioned on Neon.
#
# Render's "Infrastructure as Code" workflow can pick this file up when
# the repository is connected with "Apply via render.yaml". No values
# below contain real secrets — every secret is sourced from the
# operator's environment.
#
# Reference: https://render.com/docs/blueprint-spec
# =====================================================================

services:
  - type: web
    name: agentic-company-simulator-api
    runtime: python
    plan: free         # operator may change (e.g. "starter" for production)
    region: oregon
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    # Bind to all interfaces and use Render's $PORT. WebSocket connections
    # are supported out of the box on Render web services — the existing
    # uvicorn[standard] dependency provides the websockets implementation.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: API_PREFIX
        value: /api
      # --- Secrets (sync:false → set manually in Render dashboard) ---
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LLM_TIMEOUT
        value: "30"
      - key: LLM_MAX_RETRIES
        value: "2"
