version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: agent-company-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_company
    ports:
      - "5432:5432"
    volumes:
      - agent_company_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_company_pgdata:
